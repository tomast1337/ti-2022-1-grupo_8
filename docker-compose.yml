services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-pizzaria}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizzaria}
            POSTGRES_DB: ${POSTGRES_DB:-pizzaria}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pizzaria}"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
